<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | LibertyStack Solutions</title>
  <meta name="description" content="Contact Ishant at LibertyStack Solutions for website, e-commerce, redesign, and automation work.">
  <link rel="icon" type="image/png" href="assets/logo.png"><link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact.html">
  <main>
    <section class="hero container">
      <div><p class="eyebrow">Contact</p><h1>Tell Ishant what you want to build.</h1><p class="lead">Use the form for project queries. The visible contact method is phone only; the hidden support sender is configured in the backend environment, not shown on the site.</p><div class="contact-line"><span>Phone</span><a href="tel:+917004625082">+91 7004625082</a></div></div>
      <form class="contact-form" data-contact-form data-endpoint="https://YOUR-VERCEL-PROJECT.vercel.app/api/contact">
        <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" autocomplete="tel"></div>
        <div class="field"><label for="service">Service</label><select id="service" name="service"><option>Website Design</option><option>E-commerce Store</option><option>Website Redesign</option><option>Internal Support & AI Automation</option><option>Other Query</option></select></div>
        <div class="field"><label for="message">Query</label><textarea id="message" name="message" required></textarea></div>
        <button class="button primary" type="submit">Send Query</button>
        <p class="form-status" data-form-status aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="site.js"></script><script src="script.js"></script>
</body>
</html>
